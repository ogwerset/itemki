<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Inwentarz Domowy v2.2</title>
    <meta name="theme-color" content="#21808D">
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
</head>
<body>
    <header class="app-header">
        <h1>📦 Inwentarz Domowy</h1>
        <p class="app-subtitle">Aplikacja domowej inwentaryzacji v2.2</p>
    </header>
    <nav class="tab-nav">
        <button class="tab-btn active" data-tab="scanner">Skaner</button>
        <button class="tab-btn" data-tab="items">Przedmioty</button>
        <button class="tab-btn" data-tab="boxes">Pudełka</button>
        <button class="tab-btn" data-tab="import-export">Import/Export</button>
    </nav>
    <main>
        <section id="scanner-tab" class="tab-content active">
            <div id="qr-scanner" style="margin:auto;max-width:400px;"></div>
            <div id="scanner-status" style="margin:16px 0;"></div>
            <div style="display:flex;gap:16px;justify-content:center;margin-bottom:12px;">
                <button id="start-scan" class="btn">Start</button>
                <button id="stop-scan" class="btn btn--secondary">Stop</button>
                <button id="toggle-camera" class="btn btn--outline">Kamera</button>
            </div>
        </section>

        <section id="items-tab" class="tab-content">
            <div style="margin-bottom:16px;text-align:right;">
                <button id="add-item" class="btn btn--sm">Dodaj przedmiot</button>
            </div>
            <div class="cards-grid" id="cards-view"></div>
            <div class="table-container" id="table-view" style="margin-top:20px;"></div>
        </section>

        <section id="boxes-tab" class="tab-content">
            <div style="margin-bottom:16px;text-align:right;">
                <button id="add-box" class="btn btn--sm">Dodaj pudełko</button>
            </div>
            <div class="cards-grid" id="boxes-view"></div>
        </section>

        <section id="import-export-tab" class="tab-content">
            <div style="margin-bottom:12px;">
                <input type="file" id="import-json" accept=".json" />
                <button id="export-json" class="btn btn--sm">Export JSON</button>
            </div>
            <div style="margin-bottom:12px;">
                <input type="file" id="import-csv" accept=".csv" />
                <button id="export-csv" class="btn btn--sm">Export CSV</button>
            </div>
        </section>
    </main>

    <div id="notification-root"></div>

    <div class="modal" id="edit-item-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="edit-item-title">Edycja Przedmiotu</h3>
                <button class="modal-close" id="close-item-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="edit-item-serial" class="form-label">Numer seryjny</label>
                    <input id="edit-item-serial" class="form-control" type="text" disabled>
                </div>
                <div class="form-group">
                    <label for="edit-item-name" class="form-label">Nazwa</label>
                    <input id="edit-item-name" class="form-control" type="text">
                </div>
                <div class="form-group">
                    <label for="edit-item-box" class="form-label">Kod pudełka</label>
                    <input id="edit-item-box" class="form-control" type="text">
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-item" class="btn">Zapisz</button>
                <button id="delete-item" class="btn btn--error">Usuń</button>
            </div>
        </div>
    </div>

    <div class="modal" id="edit-box-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="edit-box-title">Edycja Pudełka</h3>
                <button class="modal-close" id="close-box-modal">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="edit-box-code" class="form-label">Kod pudełka</label>
                    <input id="edit-box-code" class="form-control" type="text">
                </div>
                <div class="form-group">
                    <label for="edit-box-name" class="form-label">Nazwa pudełka</label>
                    <input id="edit-box-name" class="form-control" type="text">
                </div>
                <div class="form-group">
                    <label for="edit-box-location" class="form-label">Lokalizacja</label>
                    <input id="edit-box-location" class="form-control" type="text">
                </div>
            </div>
            <div class="modal-footer">
                <button id="save-box" class="btn">Zapisz</button>
                <button id="delete-box" class="btn btn--error">Usuń</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
